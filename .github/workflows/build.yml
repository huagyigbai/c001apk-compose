name: 构建 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 配置 Android SDK（使用国内镜像）
        run: |
          # 设置 Android SDK 路径
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT
          
          # 下载并解压 cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip -O cmdline-tools.zip
          # 先解压到临时目录
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/tmp
          # 创建目标目录
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          # 移动解压后的文件到目标目录（避免路径冲突）
          mv $ANDROID_SDK_ROOT/tmp/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/
          # 清理临时目录
          rm -rf $ANDROID_SDK_ROOT/tmp
          
          # 配置国内镜像（阿里云）加速下载
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_SDK_ROOT \
            --repository=https://maven.aliyun.com/repository/google \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          
          # 配置环境变量
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
